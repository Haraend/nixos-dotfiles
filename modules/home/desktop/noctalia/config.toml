# Noctalia v5 declarative baseline.
# Wallpaper, location, and the suspend command are filled from lib/vars.nix at build time.
# GUI tweaks persist in ~/.local/state/noctalia/settings.toml and are not committed.

[backdrop]
enabled = true

[accessibility]
ui_scale = 1.0

[shell]
font_family = "JetBrainsMono Nerd Font"
corner_radius_scale = 1.0
telemetry_enabled = false
clipboard_enabled = true
clipboard_auto_paste = "auto"
clipboard_history_max_entries = 30
polkit_agent = true
settings_show_advanced = true

[shell.screenshot]
save_to_file = true
directory = "~/Pictures/Screenshots"
filename_pattern = "screenshot_%Y%m%d_%H%M%S"
copy_to_clipboard = true

[shell.session.power]
suspend = "@SUSPEND_CMD@"

[shell.panel]
transparency_mode = "soft"
# Placement is attached|floating; screen centering uses *_position = "center".
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
clipboard_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "floating"
session_position = "center"

[shell.animation]
enabled = true
speed = 1.0

[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"
community_palette = "ADW"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["alacritty", "btop", "niri"]

[wallpaper]
enabled = true
directory = "@WALLPAPER_DIR@"
transition_on_startup = true

[wallpaper.default]
path = "@WALLPAPER@"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = []

[desktop_widgets.grid]
visible = true
cell_size = 16
major_interval = 4

[dock]
enabled = true
auto_hide = true
background_opacity = 0.82
icon_size = 32
launcher_position = "start"
reserve_space = false

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
scale = 1.0
background_opacity = 0.97
offset_x = 20
offset_y = 8

[osd]
position = "top_right"
orientation = "horizontal"
scale = 1.0
background_opacity = 0.97
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
dnd = true
lock_keys = true
keyboard_layout = true
media = false

[lockscreen]
enabled = true
blurred_desktop = true
blur_intensity = 0.5
tint_intensity = 0.3

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@eDP-1",
  "lockscreen-widget-0000000000000002",
  "lockscreen-widget-0000000000000003",
  "lockscreen-widget-0000000000000004",
  "lockscreen-widget-0000000000000005",
]

[lockscreen_widgets.grid]
visible = true
cell_size = 32
major_interval = 4

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 768.0
cy = 759.0
rotation = 0.0
box_width = 0.0
box_height = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
type = "media_player"
output = "eDP-1"
cx = 864.0
cy = 624.0
rotation = 0.0
box_width = 320.0
box_height = 128.0

[lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
type = "weather"
output = "eDP-1"
cx = 599.28125
cy = 624.0
rotation = 0.0
box_width = 176.0
box_height = 128.0

[lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
show_forecast = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
type = "clock"
output = "eDP-1"
cx = 768.0
cy = 296.0
rotation = 0.0
box_width = 512.0
box_height = 176.0

[lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
background_opacity = 0.0
format = "{:%l:%M %p}"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
type = "button"
output = "eDP-1"
cx = 1484.0
cy = 818.0
rotation = 0.0
box_width = 0.0
box_height = 0.0

[lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
background = true
command = "noctalia msg dpms-off"
glyph = "screen-share-off"
variant = "outline"

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

[weather]
enabled = true
refresh_minutes = 30
unit = "celsius"
effects = true

[location]
auto_locate = false
address = "@LOCATION@"

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 330
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = true

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 4000

[plugins]
enabled = ["noctalia/timer", "noctalia/screen_recorder", "noctalia/translator", "noctalia/kde-connect"]

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "2"

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "moon-off"
command = "sh -c 'noctalia msg session lock; sleep 1; systemctl hibernate'"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
variant = "destructive"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "logout"
shortcut = "6"
variant = "destructive"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "weather"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "media"

[[control_center.shortcuts]]
type = "audio"

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.93
radius = 41
margin_edge = 5
margin_ends = 5
padding = 14
widget_spacing = 6
scale = 1.0
shadow = true
auto_hide = false
reserve_space = true
capsule = true

start = ["workspaces", "sysmon", "ram", "volume"]
center = ["notifications", "clock", "caffeine"]
end = ["network", "tray", "battery", "control-center"]

[widget.clock]
format = " {:%a %d | %I:%M %p} "
vertical_format = "{:%I\n%M %p - %d %m}"
tooltip_format = "{:%I:%M %p %a, %b %d}"

[widget.battery]
hide_when_full = true

[widget.control-center]
custom_image = "@LOGO@"

[widget.media]
hide_when_no_media = true
max_length = 165
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ram]
show_value = false

[widget.session]
capsule = true

[widget.sysmon]
show_value = false

[widget.workspaces]
hide_when_empty = true
